name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (GTK4 + layer shell)
        # pycairo y PyGObject se compilan en el venv: necesitan headers y
        # pkg-config, no sólo las libs de runtime. El comentario va AFUERA del
        # run: dentro, una línea "#" tras un "\" se come el resto del comando.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gtk-4.0 gir1.2-gtk4layershell-1.0 \
            libgtk4-layer-shell0 libgtk-4-1 libgtk-4-bin libgirepository-2.0-0 \
            libcairo2-dev libgirepository-2.0-dev pkg-config

      - name: Python 3.13 + venv
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias fijadas
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Suite de tests (154 tests, headless broadway; 2 skips sin display)
        # conftest.py elige GDK_BACKEND=broadway cuando no hay WAYLAND_DISPLAY.
        # Sin un servidor broadwayd, GTK no inicializa y los tests de widget
        # (centro, copiar código) crashean: hay que levantar gtk4-broadwayd.
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: :5
        run: |
          gtk4-broadwayd "$BROADWAY_DISPLAY" &
          .venv/bin/python -m pytest tests/ -q

      - name: Auditoría de dependencias
        run: |
          .venv/bin/pip install -r requirements-audit.txt
          .venv/bin/pip-audit
          .venv/bin/pip check
