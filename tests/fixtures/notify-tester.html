<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verdantis Notification Tester</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1e1e2e; color:#cdd6f4; margin:2rem; }
  h1 { color:#89b4fa; }
  button { background:#89b4fa; color:#11111b; border:0; padding:.6rem 1rem; border-radius:8px; margin:.3rem; cursor:pointer; font-weight:600; }
  button:hover { background:#74c7ec; }
  input, select { background:#313244; color:#cdd6f4; border:1px solid #45475a; border-radius:6px; padding:.4rem; margin:.3rem; }
  #log { background:#11111b; border:1px solid #45475a; border-radius:8px; padding:1rem; margin-top:1rem; white-space:pre-wrap; max-height:300px; overflow:auto; font-size:.85rem; }
  .row { margin:.4rem 0; }
  label { display:inline-block; width:140px; }
</style>
</head>
<body>
<h1>Verdantis · Tester de notificaciones</h1>
<p>Dispara notificaciones reales por el bus D-Bus de sesión. Verdantis (si es el
owner de <code>org.freedesktop.Notifications</code>) las dibuja como toasts.</p>

<div class="row"><label>Título</label><input id="title" value="Mensaje de prueba"></div>
<div class="row"><label>Cuerpo</label><input id="body" value="Esto es un body de prueba con una URL https://github.com/MoriNo23/verdantis para testear el click"></div>
<div class="row"><label>URL (click)</label><input id="url" value="https://github.com/MoriNo23/verdantis" style="width:360px"></div>
<div class="row"><label>desktop-entry</label>
  <select id="desktop">
    <option value="">(vacío)</option>
    <option value="brave-browser-nightly.desktop">brave-browser-nightly.desktop (navegador)</option>
    <option value="firefox-nightly.desktop">firefox-nightly.desktop (navegador)</option>
    <option value="brave-hnpfjngllnobngcgfapefoaidbinmjnm-Default.desktop">brave-...-Default.desktop (PWA WhatsApp)</option>
  </select>
</div>
<div class="row"><label>Acciones</label>
  <select id="actions">
    <option value="none">sin acciones</option>
    <option value="default">default (click cuerpo)</option>
  </select>
</div>

<div>
  <button id="perm">1. Pedir permiso</button>
  <button id="notify">2. Enviar notificación</button>
  <button id="notify5">Enviar x5 (stack)</button>
</div>

<div id="log"></div>

<script>
const log = (m) => {
  const el = document.getElementById('log');
  el.textContent += m + "\n";
  el.scrollTop = el.scrollHeight;
};

document.getElementById('perm').onclick = async () => {
  try {
    const p = await Notification.requestPermission();
    log("Permiso: " + p);
  } catch (e) { log("Error permiso: " + e); }
};

function sendOne() {
  if (!("Notification" in window)) { log("Notification API no disponible"); return; }
  const title = document.getElementById('title').value || "Prueba";
  const body = document.getElementById('body').value || "";
  const url = document.getElementById('url').value || "";
  const desktop = document.getElementById('desktop').value || "";
  const actMode = document.getElementById('actions').value;

  // Inyectar URL en el body como hyperlink (freedesktop body-hyperlinks)
  let bodyHtml = body;
  if (url && !body.includes(url)) bodyHtml = body + " " + url;

  const opts = { body: bodyHtml, tag: "verdantis-tester-" + Date.now(), lang: "es" };
  try {
    const n = new Notification(title, opts);
    n.onclick = () => { log("onclick nativo disparado (la app deberia enfocar)"); n.close(); };
    log("Notificación enviada: " + title + (desktop ? " [desktop-entry=" + desktop + "]" : ""));
  } catch (e) { log("Error al crear notificación: " + e); }
}

document.getElementById('notify').onclick = sendOne;
document.getElementById('notify5').onclick = () => { for (let i=0;i<5;i++) setTimeout(sendOne, i*250); };

log("Listo. Click en '1. Pedir permiso' y luego en '2. Enviar notificación'.");
</script>
</body>
</html>
