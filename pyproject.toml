[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/verdantis_daemon.py"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = [
    "-q",
    "--ignore=tests/test_uv_migration.py",
    "--ignore=tests/test_body_markup.py",
    "--ignore=tests/qa_size_test.py",
    "--ignore=tests/test_dbus_contract.py",
    "--ignore=tests/test_click_pwa.py",
    "--ignore=tests/test_click_pwa_metatest.py",
]
